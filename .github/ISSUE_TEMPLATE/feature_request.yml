name: Feature request
description: Suggest a change to Overplay
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Overplay makes hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: permissions
    attributes:
      label: Does this need a new Android permission or network access?
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: true
