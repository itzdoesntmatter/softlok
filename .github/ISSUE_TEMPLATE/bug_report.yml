name: Bug report
description: Something in Softlok is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include your override code. Redact package names and usage data if they are personal.
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 17
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add an app with a 5 minute limit
        2. Use the app
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: permissions
    attributes:
      label: Accessibility service
      options:
        - Enabled
        - Disabled
        - Not sure
    validations:
      required: true
